<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>翻翻花园</title>
<style>
  :root {
    --paper: #F6F1E7;
    --paper-deep: #ECE4D2;
    --ink: #22301F;
    --green: #2F5D3A;
    --green-deep: #1E3B28;
    --petal: #C96F4A;
    --gold: #C9A227;
    --bomb: #3A3A3A;
    --line: rgba(34,48,31,0.18);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; cursor: pointer; }

  /* ===== 菜单 ===== */
  #menu {
    max-width: 560px;
    margin: 0 auto;
    padding: 48px 24px 80px;
  }
  .menu-kicker { color: var(--green); font-size: 14px; letter-spacing: 2px; margin-bottom: 10px; }
  .menu h1 {
    font-family: Georgia, "Songti SC", serif;
    font-size: clamp(44px, 9vw, 64px);
    color: var(--green-deep);
    letter-spacing: 6px;
    margin-bottom: 10px;
  }
  .menu-sub { color: #4a5a46; font-size: 15px; margin-bottom: 34px; }
  .field { margin-bottom: 26px; }
  .field-label { font-size: 13px; color: #6b7767; letter-spacing: 1px; margin-bottom: 10px; }
  .opt-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .opt {
    padding: 14px 8px;
    border: 1.5px solid var(--line);
    border-radius: 12px;
    background: transparent;
    font-size: 15px;
    color: var(--ink);
    text-align: center;
    transition: all .15s ease;
  }
  .opt small { display: block; font-size: 11px; color: #6b7767; margin-top: 3px; }
  .opt.active { border-color: var(--green); background: var(--green); color: #F6F1E7; }
  .opt.active small { color: #c9d6c4; }
  .start-btn {
    width: 100%;
    padding: 18px;
    background: var(--green-deep);
    color: #F6F1E7;
    border: none;
    border-radius: 999px;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: 4px;
    margin-top: 10px;
  }
  .start-btn:hover { background: var(--green); }
  .best-score { margin-top: 18px; font-size: 13px; color: #6b7767; text-align: center; }

  /* ===== 游戏顶栏 ===== */
  #game { max-width: 960px; margin: 0 auto; padding: 18px 16px 60px; }
  .hud {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 16px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 12px 16px;
    margin-bottom: 14px;
  }
  .hud .item { font-size: 14px; color: #4a5a46; }
  .hud .item b { color: var(--green-deep); font-size: 18px; font-family: Georgia, serif; }
  .hud .turn { margin-left: auto; font-weight: 700; color: var(--petal); }
  .hud .combo { color: var(--gold); font-weight: 700; }
  .timer-bar { height: 6px; background: var(--paper-deep); border-radius: 3px; overflow: hidden; margin-bottom: 14px; }
  .timer-fill { height: 100%; background: var(--green); width: 100%; transition: width .3s linear; }
  .timer-fill.warn { background: var(--petal); }
  .tools { display: flex; gap: 10px; margin-bottom: 16px; }
  .tool {
    position: relative;
    padding: 10px 18px;
    border: 1.5px solid var(--green);
    background: transparent;
    color: var(--green-deep);
    border-radius: 999px;
    font-size: 14px;
  }
  .tool:disabled { opacity: .4; cursor: not-allowed; }
  .tool .cd { font-size: 11px; color: #6b7767; margin-left: 4px; }
  .pause-btn { margin-left: auto; border: 1.5px solid var(--line); background: transparent; color: #4a5a46; border-radius: 999px; padding: 10px 18px; font-size: 14px; }

  /* ===== 卡片网格 ===== */
  .board {
    display: grid;
    gap: 8px;
    justify-content: center;
  }
  .card {
    aspect-ratio: 3/4;
    border-radius: 8px;
    border: none;
    padding: 0;
    position: relative;
    background: transparent;
    perspective: 600px;
  }
  .card .face {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    border-radius: 8px;
    transition: transform .35s ease;
    backface-visibility: hidden;
  }
  .card .back {
    background: repeating-linear-gradient(45deg, var(--green-deep) 0 8px, #264a33 8px 16px);
    color: #F6F1E7;
  }
  .card .back::after { content: "✿"; font-size: 22px; opacity: .5; }
  .card .front {
    background: #fff;
    border: 2px solid var(--line);
    transform: rotateY(180deg);
    font-size: clamp(20px, 4.5vw, 38px);
  }
  .card.flip .back { transform: rotateY(180deg); }
  .card.flip .front { transform: rotateY(0deg); }
  .card.matched { opacity: .25; pointer-events: none; }
  .card .tag { font-size: clamp(11px, 2vw, 14px); font-weight: 700; letter-spacing: 2px; }
  .card.type-bomb .front { background: var(--bomb); color: #fff; }
  .card.type-hourglass .front { background: var(--gold); color: #fff; }
  .card.type-joker .front { background: var(--petal); color: #fff; }

  /* ===== 弹窗 ===== */
  .mask {
    position: fixed; inset: 0;
    background: rgba(30,59,40,.55);
    display: flex; align-items: center; justify-content: center;
    z-index: 50;
  }
  .dialog {
    background: var(--paper);
    border-radius: 16px;
    padding: 34px 30px;
    max-width: 420px;
    width: calc(100% - 40px);
    text-align: center;
  }
  .dialog h2 { font-size: 24px; color: var(--green-deep); margin-bottom: 10px; }
  .dialog p { color: #4a5a46; font-size: 15px; margin-bottom: 6px; }
  .dialog .big { font-size: 34px; color: var(--petal); font-family: Georgia, serif; margin: 10px 0; }
  .dialog button {
    margin-top: 18px;
    padding: 13px 34px;
    background: var(--green-deep); color: #F6F1E7;
    border: none; border-radius: 999px; font-size: 15px;
  }
  .hidden { display: none !important; }
  .toast {
    position: fixed; left: 50%; top: 18%; transform: translateX(-50%);
    background: var(--green-deep); color: #F6F1E7;
    padding: 10px 22px; border-radius: 999px; font-size: 14px;
    z-index: 60; opacity: 0; transition: opacity .25s ease;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<!-- ===== 菜单 ===== -->
<div id="menu">
  <div class="menu-kicker">macOS · Web 版</div>
  <h1>翻翻花园</h1>
  <p class="menu-sub">翻牌配对，三关递进：4×4 → 6×6 → 8×8。小心炸弹，用好沙漏和百变牌。</p>

  <div class="field">
    <div class="field-label">模式</div>
    <div class="opt-row" id="modeOpts">
      <button class="opt active" data-v="solo">单人</button>
      <button class="opt" data-v="duo">双人同屏<small>轮流翻牌</small></button>
      <button class="opt" data-v="ai">人机对战<small>你先手</small></button>
    </div>
  </div>

  <div class="field">
    <div class="field-label">难度</div>
    <div class="opt-row" id="diffOpts">
      <button class="opt" data-v="baby">宝宝<small>记忆10s · 无炸弹</small></button>
      <button class="opt active" data-v="normal">普通<small>记忆5s · 每关2弹</small></button>
      <button class="opt" data-v="hard">困难<small>记忆3s · 每关4弹</small></button>
    </div>
  </div>

  <div class="field hidden" id="aiField">
    <div class="field-label">AI 类型（人机模式）</div>
    <div class="opt-row" id="aiOpts">
      <button class="opt active" data-v="forget">健忘型<small>FIFO 记忆8格</small></button>
      <button class="opt" data-v="master">记忆大师<small>全记住 · 有配对上限</small></button>
    </div>
  </div>

  <button class="start-btn" id="startBtn">开 始</button>
  <p class="best-score" id="bestLine"></p>
</div>

<!-- ===== 游戏 ===== -->
<div id="game" class="hidden">
  <div class="hud">
    <span class="item">关卡 <b id="hLevel">1</b>/3</span>
    <span class="item">分数 <b id="hScore">0</b></span>
    <span class="item combo" id="hCombo"></span>
    <span class="item">剩余 <b id="hTime">60</b>s</span>
    <span class="turn" id="hTurn">你</span>
    <button class="pause-btn" id="pauseBtn">暂停</button>
  </div>
  <div class="timer-bar"><div class="timer-fill" id="timerFill"></div></div>
  <div class="tools">
    <button class="tool" id="toolPeek">透视<span class="cd" id="cdPeek"></span></button>
    <button class="tool" id="toolShuffle">洗牌<span class="cd" id="cdShuffle"></span></button>
  </div>
  <div class="board" id="board"></div>
</div>

<!-- ===== 弹窗 ===== -->
<div class="mask hidden" id="mask">
  <div class="dialog">
    <h2 id="dTitle"></h2>
    <p id="dDesc"></p>
    <div class="big" id="dBig"></div>
    <button id="dBtn">继续</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
  // ===== 配置 =====
  const DIFF = {
    baby:   { memo:10, levelT:[120,120,120], move:[20,16,12], bombs:0 },
    normal: { memo:5,  levelT:[60,60,60],   move:[10,8,6],  bombs:2 },
    hard:   { memo:3,  levelT:[45,45,45],   move:[8,6,4],  bombs:4 },
  };
  const N = [4,6,8];
  const AI_LIMIT = [2,3,4];
  const SHAPES = ["●","■","▲","◆","★","♥","✦","❖"];
  const COLORS = ["#2F5D3A","#C96F4A","#C9A227","#5B6EA8"];

  // ===== 状态 =====
  let cfg = { mode:'solo', diff:'normal', aiType:'forget' };
  let S = null;

  const $ = id => document.getElementById(id);

  // ===== 菜单交互 =====
  function bindOpts(rowId, key, onChange) {
    $(rowId).addEventListener('click', e => {
      const b = e.target.closest('.opt'); if (!b) return;
      $(rowId).querySelectorAll('.opt').forEach(o => o.classList.remove('active'));
      b.classList.add('active');
      cfg[key] = b.dataset.v;
      if (onChange) onChange();
    });
  }
  bindOpts('modeOpts','mode', () => {
    $('aiField').classList.toggle('hidden', cfg.mode !== 'ai');
  });
  bindOpts('diffOpts','diff');
  bindOpts('aiOpts','aiType');

  const best = Number(localStorage.getItem('fanfan_best') || 0);
  $('bestLine').textContent = best > 0 ? `本机最高分：${best}` : '';

  $('startBtn').addEventListener('click', () => startGame());

  // ===== 工具 =====
  function toast(t) {
    const el = $('toast'); el.textContent = t; el.classList.add('show');
    clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 1400);
  }
  function pad(n){ return n<10?'0'+n:''+n; }

  // ===== 发牌 =====
  function buildBoard(levelIdx) {
    const n = N[levelIdx];
    const total = n*n;
    const d = DIFF[cfg.diff];
    const bombN = d.bombs;
    const hourN = 2, jokerN = 2;
    const normalPairs = (total - hourN - jokerN - bombN) / 2;

    const pool = [];
    SHAPES.forEach(s => COLORS.forEach(c => pool.push({s,c})));
    // 打乱取 normalPairs 个
    for (let i = pool.length-1; i>0; i--) {
      const j = Math.floor(Math.random()*(i+1));
      [pool[i],pool[j]] = [pool[j],pool[i]];
    }
    const cards = [];
    for (let i=0;i<normalPairs;i++) {
      const {s,c} = pool[i];
      cards.push({type:'normal', sym:s, color:c, key:i});
      cards.push({type:'normal', sym:s, color:c, key:i});
    }
    cards.push({type:'hourglass', key:'h'}); cards.push({type:'hourglass', key:'h'});
    cards.push({type:'joker', key:'j'});   cards.push({type:'joker', key:'j'});
    for (let i=0;i<bombN;i++) cards.push({type:'bomb', key:'b'+i});

    // 洗牌
    for (let i=cards.length-1;i>0;i--) {
      const j = Math.floor(Math.random()*(i+1));
      [cards[i],cards[j]] = [cards[j],cards[i]];
    }
    cards.forEach((c,i) => { c.pos=i; c.flipped=false; c.matched=false; });
    return cards;
  }

  // ===== 开始 =====
  function startGame() {
    S = {
      level: 0,
      score: [0,0],           // P0 / P1 双人；单人只用 [0]
      combo: [0,0],
      turn: 0,                // 当前玩家 index
      phase: 'memorize',
      peekCD: [0,0], shuffleCD: [0,0],
      aiMem: [],              // 健忘型
      aiSeen: {},             // 记忆大师: pos -> card
      aiThisTurn: 0,
      moveTimeLeft: 0,
      timerId: null,
      memLeft: 0,
      totalLeft: 0,
      pending: [],
    };
    $('menu').classList.add('hidden');
    $('game').classList.remove('hidden');
    nextLevel();
  }

  function nextLevel() {
    const li = S.level;
    S.cards = buildBoard(li);
    S.pending = [];
    S.combo = [0,0];
    S.aiThisTurn = 0;
    renderBoard();
    // 记忆阶段
    S.phase = 'memorize';
    S.memLeft = DIFF[cfg.diff].memo;
    S.cards.forEach(c => c.flipped = true);
    renderBoard();
    dialog('记住牌面', `${DIFF[cfg.diff].memo} 秒后开始计时`, `${N[li]}×${N[li]} · 第 ${li+1} 关`, '开始记忆', () => {
      startMemoCountdown();
    }, true);
  }

  function startMemoCountdown() {
    clearInterval(S.timerId);
    S.timerId = setInterval(() => {
      S.memLeft -= 1;
      updateHud();
      if (S.memLeft <= 0) {
        clearInterval(S.timerId);
        S.cards.forEach(c => { if(!c.matched) c.flipped = false; });
        renderBoard();
        startPlay();
      }
    }, 1000);
  }

  function startPlay() {
    S.phase = 'play';
    S.totalLeft = DIFF[cfg.diff].levelT[S.level];
    S.moveTimeLeft = 0;
    // 人机：你先手，直接等你点
    // 双人：turn=0
    clearInterval(S.timerId);
    S.timerId = setInterval(tick, 250);
    updateHud();
  }

  function tick() {
    if (S.phase !== 'play' || S.paused) return;
    S.totalLeft -= 0.25;
    if (S.moveTimeLeft > 0) {
      S.moveTimeLeft -= 0.25;
      if (S.moveTimeLeft <= 0) {
        // 操作超时：视为失败
        S.moveTimeLeft = 0;
        failTurn('超时', true);
      }
    }
    // 冷却随游戏时间递减
    [0,1].forEach(p => {
      if (S.peekCD[p] > 0) S.peekCD[p] = Math.max(0, S.peekCD[p] - 0.25);
      if (S.shuffleCD[p] > 0) S.shuffleCD[p] = Math.max(0, S.shuffleCD[p] - 0.25);
    });
    if (S.totalLeft <= 0) {
      S.totalLeft = 0;
      clearInterval(S.timerId);
      gameOver(false, '时间耗尽');
    }
    updateHud();
  }

  // ===== 渲染 =====
  function renderBoard() {
    const n = N[S.level];
    const board = $('board');
    board.style.gridTemplateColumns = `repeat(${n}, minmax(0,1fr))`;
    board.style.maxWidth = n<=4 ? '420px' : n<=6 ? '560px' : '720px';
    board.innerHTML = '';
    S.cards.forEach(c => {
      const b = document.createElement('button');
      b.className = 'card' + (c.flipped?' flip':'') + (c.matched?' matched':'') + (c.type==='bomb'?' type-bomb':c.type==='hourglass'?' type-hourglass':c.type==='joker'?' type-joker':'');
      if (c.matched) b.classList.add('matched');
      const front = document.createElement('div');
      front.className = 'face front';
      if (c.type === 'normal') {
        front.textContent = c.sym;
        front.style.color = c.color;
      } else {
        const t = document.createElement('span');
        t.className = 'tag';
        t.textContent = c.type==='bomb' ? '炸弹' : c.type==='hourglass' ? '沙漏' : '百变';
        front.appendChild(t);
      }
      const back = document.createElement('div');
      back.className = 'face back';
      b.appendChild(back); b.appendChild(front);
      b.addEventListener('click', () => onCard(c));
      board.appendChild(b);
    });
  }

  function curName() {
    if (cfg.mode === 'solo') return '你';
    if (cfg.mode === 'duo') return S.turn===0 ? '玩家 1' : '玩家 2';
    return S.turn===0 ? '你' : '机器人';
  }

  function updateHud() {
    $('hLevel').textContent = S.level+1;
    const total = cfg.mode==='duo' ? S.score[0]+' : '+S.score[1] : S.score[0];
    $('hScore').textContent = total;
    $('hTurn').textContent = curName();
    const ct = Math.ceil(Math.max(0,S.totalLeft));
    $('hTime').textContent = ct;
    $('timerFill').style.width = (S.totalLeft / DIFF[cfg.diff].levelT[S.level] * 100) + '%';
    $('timerFill').classList.toggle('warn', S.totalLeft < 15);
    // combo
    const c = S.combo[S.turn];
    $('hCombo').textContent = c>=2 ? `Combo x${c}` : '';
    // 操作限时提示
    if (S.moveTimeLeft > 0) $('hTime').textContent = Math.ceil(S.moveTimeLeft)+' (翻牌限时)';
    // 冷却
    $('cdPeek').textContent = S.peekCD[S.turn]>0 ? Math.ceil(S.peekCD[S.turn])+'s' : '';
    $('cdShuffle').textContent = S.shuffleCD[S.turn]>0 ? Math.ceil(S.shuffleCD[S.turn])+'s' : '';
    $('toolPeek').disabled = S.phase!=='play' || S.pending.length!==0 || S.peekCD[S.turn]>0;
    $('toolShuffle').disabled = S.phase!=='play' || S.pending.length!==0 || S.shuffleCD[S.turn]>0;
  }

  // ===== 翻牌 =====
  function onCard(c) {
    if (S.phase !== 'play' || S.paused) return;
    if (cfg.mode === 'ai' && S.turn === 1) return;
    if (c.matched || c.flipped) return;
    if (S.pending.includes(c)) return;

    if (S.pending.length === 0) {
      // 第一张：启动操作限时
      const m = DIFF[cfg.diff].move[S.level];
      S.moveTimeLeft = m + (S.moveBonus||0);
      S.moveBonus = 0;
    }
    c.flipped = true;
    S.pending.push(c);
    remember(c);
    renderBoard();

    if (c.type === 'bomb') {
      // 翻到炸弹立即爆炸
      setTimeout(() => explode(c), 450);
      return;
    }
    if (S.pending.length === 2) {
      setTimeout(() => judge(), 600);
    }
  }

  function remember(c) {
    if (cfg.mode !== 'ai') return;
    if (S.aiType === 'forget') {
      S.aiMem.push({pos:c.pos, key:c.key, type:c.type});
      if (S.aiMem.length > 8) S.aiMem.shift();
    } else {
      S.aiSeen[c.pos] = c;
    }
  }

  function judge() {
    const [a,b] = S.pending;
    S.pending = [];
    S.moveTimeLeft = 0;
    const pair = isPair(a,b);
    if (pair.ok) {
      onSuccess(a,b,pair);
    } else {
      failTurn('配对失败', false);
    }
  }

  function isPair(a,b) {
    // 炸弹在 onCard 里已单独处理，走到这里 a,b 都不是炸弹
    if (a.type==='joker' || b.type==='joker') {
      return {ok:true, joker:true};
    }
    if (a.type==='hourglass' && b.type==='hourglass') return {ok:true, hourglass:true};
    if (a.type==='normal' && b.type==='normal' && a.key===b.key) return {ok:true};
    return {ok:false};
  }

  function onSuccess(a,b,pair) {
    a.matched = b.matched = true;
    a.flipped = b.flipped = false;
    const p = S.turn;
    S.combo[p]++;
    const base = 10 + 2*(S.combo[p]-1);
    S.score[p] += base;
    // 普通配对 +3 秒
    S.totalLeft = Math.min(DIFF[cfg.diff].levelT[S.level], S.totalLeft + 3);
    if (pair.hourglass) {
      S.totalLeft += 0; // 已含 +3
      S.moveBonus = 3;
      toast(`沙漏 +3 秒下回合操作`);
    }
    if (pair.joker) {
      // Joker 配走普通牌时，剩余同图案那张变 Joker
      if (a.type!=='joker') convertSiblingToJoker(a);
      if (b.type!=='joker') convertSiblingToJoker(b);
    }
    renderBoard();
    updateHud();
    checkLevelClear();
    // 双人/AI：成功保留回合，不换人
    if (cfg.mode==='ai') {
      S.aiThisTurn++;
      const limit = AI_LIMIT[S.level];
      if (S.turn === 1 && S.aiThisTurn >= limit) {
        switchTurn('AI 达到配对上限');
      }
    }
    if (cfg.mode==='ai' && S.turn===1) {
      // AI 继续自己的下一次操作
      setTimeout(aiMove, 800);
    }
  }

  function convertSiblingToJoker(normalCard) {
    const sib = S.cards.find(c => c!==normalCard && c.key===normalCard.key && !c.matched);
    if (sib) {
      sib.type = 'joker'; sib.key = 'j';
    }
  }

  function failTurn(reason, timedOut) {
    const p = S.turn;
    S.score[p] -= 5;
    S.combo[p] = 0;
    toast(reason + ' · -5 分');
    if (cfg.mode==='solo') {
      S.totalLeft -= 3;
      // 单人：盖回，继续本回合
      S.pending.forEach(c => c.flipped = false);
      S.pending = [];
      renderBoard();
      updateHud();
      if (S.totalLeft <= 0) { clearInterval(S.timerId); gameOver(false,'时间耗尽'); }
      return;
    }
    // 双人/AI：盖回并换人
    S.pending.forEach(c => c.flipped = false);
    S.pending = [];
    renderBoard();
    switchTurn(reason);
  }

  function explode(card) {
    card.matched = true; // 炸弹移除，不计清关目标
    card.flipped = false;
    const p = S.turn;
    S.score[p] -= 5;
    S.combo[p] = 0;
    toast('💥 爆炸 · -5 分 · 连击清零');
    S.pending = [];
    S.moveTimeLeft = 0;
    renderBoard();
    if (cfg.mode==='solo') {
      // 单人：重新开始一次操作
      updateHud();
      return;
    }
    switchTurn('踩到炸弹');
  }

  function switchTurn(msg) {
    S.turn = 1 - S.turn;
    S.aiThisTurn = 0;
    S.moveTimeLeft = 0;
    toast(msg + ' → ' + curName() + ' 回合');
    updateHud();
    if (cfg.mode==='ai' && S.turn===1) {
      setTimeout(aiMove, 900);
    }
  }

  function checkLevelClear() {
    const remain = S.cards.filter(c => !c.matched && c.type!=='bomb');
    if (remain.length === 0) {
      clearInterval(S.timerId);
      S.level++;
      const totalScore = cfg.mode==='duo' ? S.score[0]+' : '+S.score[1] : S.score[0];
      if (S.level >= 3) {
        gameOver(true, totalScore);
      } else {
        // 单人过关：总时间恢复初始，分数累计
        dialog('第 '+(S.level)+' 关完成', `总分 ${totalScore}`, `准备 ${N[S.level]}×${N[S.level]}`, '下一关', () => nextLevel());
      }
    }
  }

  // ===== AI =====
  function aiMove() {
    if (S.phase!=='play' || S.paused) return;
    if (S.turn !== 1 || cfg.mode !== 'ai') return;
    // 找一对已知可配的牌
    let pair = null;
    if (cfg.aiType === 'master') {
      const byKey = {};
      Object.values(S.aiSeen).forEach(c => {
        if (c.matched || c.type==='bomb') return;
        const k = c.key;
        if (!byKey[k]) byKey[k] = [];
        byKey[k].push(c);
      });
      for (const k in byKey) {
        if (byKey[k].length >= 2) { pair = byKey[k]; break; }
      }
    } else {
      const byKey = {};
      S.aiMem.forEach(x => {
        const c = S.cards[x.pos];
        if (!c || c.matched || c.type==='bomb') return;
        const k = c.key;
        if (!byKey[k]) byKey[k] = [];
        byKey[k].push(c);
      });
      for (const k in byKey) {
        if (byKey[k].length >= 2) { pair = byKey[k]; break; }
      }
    }

    if (pair) {
      aiFlip(pair[0], () => {
        setTimeout(() => aiFlip(pair[1], () => {}), 800);
      });
    } else {
      // 随机翻一张未见过的
      const unknown = S.cards.filter(c => !c.matched && !c.flipped && c.type!=='bomb' &&
        !(cfg.aiType==='master' ? S.aiSeen[c.pos] : S.aiMem.some(x=>x.pos===c.pos)));
      const pool = unknown.length ? unknown : S.cards.filter(c => !c.matched && !c.flipped && c.type!=='bomb');
      if (!pool.length) return;
      const pick = pool[Math.floor(Math.random()*pool.length)];
      aiFlip(pick, () => {
        // 翻完第一张后，看这张有没有见过的配对
        setTimeout(() => {
          const match = S.cards.find(c => !c.matched && c!==pick && c.type!=='bomb' && c.key===pick.key);
          if (match && (cfg.aiType==='master' ? S.aiSeen[match.pos] : S.aiMem.some(x=>x.pos===match.pos))) {
            aiFlip(match, () => {});
          } else {
            const rest = S.cards.filter(c => !c.matched && !c.flipped && c.type!=='bomb');
            if (rest.length) aiFlip(rest[Math.floor(Math.random()*rest.length)], () => {});
          }
        }, 800);
      });
    }
  }

  function aiFlip(cb, done) {
    if (S.turn!==1) return;
    if (S.pending.length===0) {
      S.moveTimeLeft = DIFF[cfg.diff].move[S.level];
    }
    cb.flipped = true;
    S.pending.push(cb);
    remember(cb);
    renderBoard();
    if (cb.type==='bomb') {
      setTimeout(() => explode(cb), 450);
      return;
    }
    if (S.pending.length===2) {
      setTimeout(() => judge(), 650);
    }
  }

  // ===== 道具 =====
  $('toolPeek').addEventListener('click', () => {
    const p = S.turn;
    if (S.peekCD[p]>0 || S.pending.length) return;
    S.peekCD[p] = 30;
    const hidden = S.cards.filter(c => !c.matched && !c.flipped);
    hidden.forEach(c => c.flipped = true);
    renderBoard();
    toast('透视 1 秒');
    setTimeout(() => {
      hidden.forEach(c => c.flipped = false);
      renderBoard();
    }, 1000);
  });

  $('toolShuffle').addEventListener('click', () => {
    const p = S.turn;
    if (S.shuffleCD[p]>0 || S.pending.length) return;
    S.shuffleCD[p] = 20;
    const remain = S.cards.filter(c => !c.matched);
    const poses = remain.map(c => c.pos);
    for (let i=poses.length-1;i>0;i--) {
      const j = Math.floor(Math.random()*(i+1));
      [poses[i],poses[j]] = [poses[j],poses[i]];
    }
    remain.forEach((c,i) => c.pos = poses[i]);
    S.aiMem = [];
    S.aiSeen = {};
    renderBoard();
    toast('已洗牌，AI 记忆清空');
  });

  $('pauseBtn').addEventListener('click', () => {
    S.paused = !S.paused;
    $('pauseBtn').textContent = S.paused ? '继续' : '暂停';
    toast(S.paused ? '已暂停' : '继续');
  });

  // ===== 弹窗 =====
  function dialog(title, desc, big, btn, onOk, noCancel) {
    $('dTitle').textContent = title;
    $('dDesc').textContent = desc || '';
    $('dBig').textContent = big || '';
    $('dBtn').textContent = btn;
    $('mask').classList.remove('hidden');
    $('dBtn').onclick = () => {
      $('mask').classList.add('hidden');
      onOk && onOk();
    };
  }

  function gameOver(win, scoreOrReason) {
    const total = cfg.mode==='duo' ? (S.score[0]+' : '+S.score[1]) : S.score[0];
    if (cfg.mode!=='duo') {
      const b = Number(localStorage.getItem('fanfan_best')||0);
      if (Number(total) > b) localStorage.setItem('fanfan_best', total);
    }
    dialog(win ? '通关！' : '游戏结束', win ? '三关全部完成' : scoreOrReason, `总分 ${total}`, '回到菜单', () => {
      $('mask').classList.add('hidden');
      $('game').classList.add('hidden');
      $('menu').classList.remove('hidden');
      $('bestLine').textContent = '本机最高分：'+localStorage.getItem('fanfan_best');
    });
  }
})();
</script>
</body>
